<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ai Ai Banana</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#3b1f0a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1507}}
:root[data-theme="dark"]{--bg:#2a1507}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Press Start 2P',ui-monospace,monospace}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}
#game{position:relative}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#score{position:absolute;top:calc(var(--u)*9);left:0;right:0;text-align:center;color:#fff;font-size:calc(var(--u)*12);text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 #7a3a0a,calc(var(--u)*-1) calc(var(--u)*1) 0 #7a3a0a,0 calc(var(--u)*2) 0 #7a3a0a;pointer-events:none}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:calc(var(--u)*7);line-height:1.6;text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 #7a3a0a;pointer-events:none}
#msg .big{font-size:calc(var(--u)*13);color:#ffd23f;line-height:1.3;margin-bottom:calc(var(--u)*10)}
#msg .blink{animation:b 1s steps(2) infinite}
@keyframes b{50%{opacity:0}}
#toast{position:absolute;top:calc(var(--u)*30);left:0;right:0;text-align:center;color:#fff3a0;font-size:calc(var(--u)*7);text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 #7a3a0a;opacity:0;pointer-events:none}
.btn{display:block;width:calc(var(--u)*84);margin:calc(var(--u)*3) auto;padding:calc(var(--u)*4) 0;font:inherit;font-size:calc(var(--u)*6);color:#fff;background:#ff9530;border:0;box-shadow:0 calc(var(--u)*2) 0 #7a3a0a,0 0 0 calc(var(--u)*1) #4a2c17;cursor:pointer;text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 #7a3a0a}
.btn:active{transform:translateY(calc(var(--u)*1))}
#pause{position:absolute;top:calc(var(--u)*4);right:calc(var(--u)*4);width:calc(var(--u)*14);height:calc(var(--u)*14);padding:0;margin:0;display:none;z-index:5;font-size:calc(var(--u)*7)}
#msg.dim{background:rgba(74,44,23,.72)}
#msg .hl{color:#ffd23f}#msg .num{font-size:calc(var(--u)*20);color:#fff3a0}
.vbar{display:flex;align-items:flex-end;gap:calc(var(--u)*1);padding:calc(var(--u)*2);background:#4a2c17;box-shadow:0 calc(var(--u)*2) 0 #7a3a0a;margin:calc(var(--u)*3) 0 calc(var(--u)*6);touch-action:none;cursor:pointer}
.vbar i{display:block;width:calc(var(--u)*6);background:#8b5a2b}
.vbar i.on{background:#ffd23f;box-shadow:inset 0 calc(var(--u)*-2) 0 #ff9530}
#pause{align-items:center;justify-content:center;gap:calc(var(--u)*2)}
#pause span{display:block;width:calc(var(--u)*3);height:calc(var(--u)*8);background:#fff;box-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 #7a3a0a}
#pause svg{display:block;width:calc(var(--u)*10);height:calc(var(--u)*12)}
#pause{box-shadow:inset calc(var(--u)*1) calc(var(--u)*1) 0 #ffd23f,inset calc(var(--u)*-1) calc(var(--u)*-1) 0 #e8741c,0 calc(var(--u)*2) 0 #7a3a0a,0 0 0 calc(var(--u)*1) #4a2c17}
</style></head><body>
<div id="wrap"><div id="game">
<canvas id="c"></canvas>
<div id="score">0</div><div id="toast">SPEED UP!</div><div id="msg"></div><button class="btn" id="pause" aria-label="Pause"><svg viewBox="0 0 10 12" shape-rendering="crispEdges" aria-hidden="true"><path fill="#4a2c17" d="M1 0h2v12H1zM0 1h4v10H0zM7 0h2v12H7zM6 1h4v10H6z"/><path fill="#fff" d="M1 1h1v10H1zM7 1h1v10H7z"/><path fill="#ffd23f" d="M2 1h1v10H2zM8 1h1v10H8z"/></svg></button>
</div></div>
<script>
const W=144,H=256,GY=228,HEAD=GY-30,COLS=[24,72,120];
const cv=document.getElementById('c'),ctx=cv.getContext('2d');cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;
const game=document.getElementById('game'),$=id=>document.getElementById(id);
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);game.style.width=W*s+'px';game.style.height=H*s+'px';game.style.setProperty('--u',s+'px')}
addEventListener('resize',fit);fit();

// ---- pixel sprites ----
const PAL={g:'#e8741c',h:'#fff3a0',s:'#ffa526',e:'#4a2c17',c:'#ff8f6b',d:'#4a2c17',b:'#8b5a2b',l:'#c28a4a',p:'#f4b393',y:'#ffd23f',o:'#fff3a0',k:'#7a4a12',r:'#e8412c'};
function mk(rows,mirror){const w=rows[0].length*(mirror?2:1),c=document.createElement('canvas');c.width=w;c.height=rows.length;const x=c.getContext('2d');
rows.forEach((row,j)=>[...(mirror?row+[...row].reverse().join(''):row)].forEach((ch,i)=>{if(ch!=='.'){x.fillStyle=PAL[ch];x.fillRect(i,j,1,1)}}));return c}
const monkey=mk(["....dddd","..dddbbb",".dpdbbbb",".dpdbbbb","..dddbbb","....dbbb","..dbbbbb",".dbbbbll",".dbbblll",".dbbblll","..dbbbll","..dbbbbb","..dbbbbd","..dlllld","..dddddd"],true);
const tail=mk(["...dd","..dbd",".dbd.","dbd..","dd..."]);
const banana=mk(["......dd",".....dyd","....dyyd","...dyoyd","..dyoyyd",".dyoyyd.","dyyyyd..",".dddd..."]);
const heart=mk([".rr.rr.","rrrrrrr","rrrrrrr",".rrrrr.","..rrr..","...r..."]);

// ---- background (drawn once) ----
const bg=document.createElement('canvas');bg.width=W;bg.height=H;
(function(){const x=bg.getContext('2d');
['#ffe680','#ffdb66','#ffcf55','#ffc247','#ffb43d','#ffa535','#ff9530','#ff8528'].forEach((c,i)=>{x.fillStyle=c;x.fillRect(0,i*29,W,29)});
const R=[".....gggggg.....","...gggyyyyggg...","..ggyyyyyyyygg..",".ggyhhyyyyyyygg.",".gyhhyyyyyyyyyg.","ggyhyyyyyyyyyygg","gyyyyyyyyyyyyyyg","gyyyyyyyyyyyyyyg","gyyyyyyyyyyyyyyg","gyyyyyyyyyyyyysg","ggyyyyyyyyyyysgg",".gyyyyyyyyysssg.",".ggyyyyyyysssgg.","..ggyyyyssssgg..","...gggyyssggg...",".....gggggg....."].map(r=>[...r]);
[[6,5],[7,5],[6,10],[7,10],[9,6],[9,9],[10,7],[10,8]].forEach(([j,i])=>R[j][i]='e');
[[8,3],[8,12]].forEach(([j,i])=>R[j][i]='c');
x.fillStyle='#ff9f2e';[[106,20,4,8],[106,68,4,8],[80,46,8,4],[128,46,8,4]].forEach(r=>x.fillRect(...r));
[[1,1],[1,-1],[-1,1],[-1,-1]].forEach(([a,b])=>{x.fillRect(108+a*17-2,48+b*17-2,4,4);x.fillRect(108+a*24-2,48+b*24-2,4,4)});
x.imageSmoothingEnabled=false;x.drawImage(mk(R.map(r=>r.join(''))),92,32,32,32);
x.fillStyle='rgba(255,255,255,.35)';[[14,90,24],[88,120,30],[30,160,22]].forEach(([a,b,w])=>{x.fillRect(a,b,w,4);x.fillRect(a+4,b-4,w-10,4)});
x.fillStyle='#e88a2d';x.fillRect(0,GY,W,4);x.fillStyle='#c2681f';x.fillRect(0,GY+4,W,H-GY);
x.fillStyle='#a8561a';for(let y=GY+4;y<H;y+=4)for(let i=((y/4)%2)*4;i<W;i+=8)x.fillRect(i,y,4,4);
})();

// ---- settings & storage ----
let vol=.7,muted=false,best=0,newBest=false;
try{const j=JSON.parse(localStorage.getItem('aab')||'{}');if(typeof j.vol==='number')vol=j.vol;muted=!!j.muted;best=j.best|0}catch(e){}
function save(){try{localStorage.setItem('aab',JSON.stringify({vol,muted,best}))}catch(e){}}

// ---- audio (square-wave chiptune) ----
let ac,master;
function applyVol(){if(master)master.gain.value=muted?0:vol}
function aud(){if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(A){ac=new A();master=ac.createGain();master.connect(ac.destination);applyVol()}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f,t,d,type,v,f2){if(!ac)return;const T=ac.currentTime+t,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,T);
if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+d);g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(g).connect(master);o.start(T);o.stop(T+d)}
const sfx={catch:()=>tone(660,0,.09,'square',.1,990),
up:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.07,.12,'square',.12)),
miss:()=>tone(220,0,.25,'sawtooth',.1,90),
start:()=>[392,523,659].forEach((f,i)=>tone(f,i*.06,.1,'square',.1))};

// ---- game state ----
let st='title',bananas=[],parts=[],caught=0,lives=3,col=1,mx=COLS[1],spawnT=0,bob=0,toastT=0,lockT=0,t=0;
// each 10 catches multiplies speed, but the boost shrinks: x1.30, x1.26, x1.22 ... down to x1.05
const speed=()=>{let m=1;for(let i=0;i<Math.floor(caught/10);i++)m*=1+Math.max(.05,.30-.04*i);return 55*m};

// ---- menus ----
const Bt=(a,l)=>'<button class="btn" data-a="'+a+'">'+l+'</button>';
function screen(name){
 const m=$('msg');m.className=(name&&name!=='home')?'dim':'';m.style.pointerEvents=name?'auto':'none';
 const S={
 home:'<div class="big">AI AI<br>BANANA</div>'+Bt('play','PLAY')+Bt('hs','HIGH SCORE')+Bt('set','SETTINGS'),
 pause:'<div class="big">PAUSED</div>'+Bt('resume','RESUME')+Bt('hs','HIGH SCORE')+Bt('set','SETTINGS')+Bt('home','HOME'),
 over:'<div class="big">GAME<br>OVER</div><div>SCORE '+caught+'</div>'+(newBest?'<div class="hl">NEW BEST!</div>':'<div>BEST '+best+'</div>')+'<br>'+Bt('play','RETRY')+Bt('home','HOME'),
 hs:'<div class="big">HIGH<br>SCORE</div><div class="num">'+best+'</div><br>'+Bt('back','BACK'),
 set:'<div class="big">SETTINGS</div>'+Bt('mute','SOUND: '+(muted?'OFF':'ON'))+'<div>VOLUME</div><div class="vbar" id="vol">'+Array.from({length:10},(_,i)=>'<i'+(i<Math.round(vol*10)?' class="on"':'')+' style="height:calc(var(--u)*'+(4+i)+')"></i>').join('')+'</div>'+Bt('back','BACK')};
 m.innerHTML=name?S[name]:'';
 $('score').style.visibility=st==='title'?'hidden':'visible';
 $('pause').style.display=st==='play'?'flex':'none';
}
function start(){aud();sfx.start();st='play';bananas=[];parts=[];caught=0;lives=3;col=1;spawnT=.6;newBest=false;$('score').textContent=0;screen('')}
function over(){st='over';lockT=.6;if(caught>best){best=caught;newBest=true;save()}screen('over')}
function pause(){if(st==='play'){st='paused';screen('pause')}}
function resume(){if(st==='paused'){st='play';screen('')}}
function act(a){aud();
 if((a==='play'||a==='home')&&st==='over'&&lockT>0)return;
 if(a==='play')start();
 else if(a==='resume')resume();
 else if(a==='home'){st='title';bananas=[];parts=[];screen('home')}
 else if(a==='hs'||a==='set')screen(a);
 else if(a==='back')screen(st==='paused'?'pause':'home');
 else if(a==='mute'){muted=!muted;applyVol();save();screen('set')}}
$('msg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)act(b.dataset.a)});
let drag=false;
function setVol(e){const r=$('vol').getBoundingClientRect(),n=Math.max(0,Math.min(10,Math.round((e.clientX-r.left)/r.width*10)));vol=n/10;applyVol();save();[...$('vol').children].forEach((c,i)=>c.classList.toggle('on',i<n))}
$('msg').addEventListener('pointerdown',e=>{if(e.target.closest('#vol')){aud();drag=true;$('vol').setPointerCapture(e.pointerId);setVol(e)}});
$('msg').addEventListener('pointermove',e=>{if(drag)setVol(e)});
$('msg').addEventListener('pointerup',()=>{if(drag){drag=false;sfx.catch()}});
$('pause').addEventListener('click',()=>{aud();pause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});

// ---- input ----
function move(d){if(st==='play')col=Math.max(0,Math.min(2,col+d))}
addEventListener('pointerdown',e=>{if(st==='play'&&!e.target.closest('#pause'))move(e.clientX<innerWidth/2?-1:1)});
addEventListener('keydown',e=>{const k=e.key;aud();
if(k==='ArrowLeft'||k==='a'){move(-1);e.preventDefault()}
else if(k==='ArrowRight'||k==='d'){move(1);e.preventDefault()}
else if(k==='p'||k==='Escape'){st==='play'?pause():resume()}
else if((k==='Enter'||k===' ')&&!e.target.closest('button')){if(st==='title'||(st==='over'&&lockT<=0))start();else if(st==='paused')resume();e.preventDefault()}});

function burst(x,y){for(let i=0;i<6;i++)parts.push({x,y,vx:(Math.random()-.5)*80,vy:-30-Math.random()*50,l:.4})}
function update(dt){
mx+=(COLS[col]-mx)*Math.min(1,dt*18);bob=Math.max(0,bob-dt);toastT=Math.max(0,toastT-dt);lockT=Math.max(0,lockT-dt);
$('toast').style.opacity=toastT>0?1:0;
parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.l-=dt});parts=parts.filter(p=>p.l>0);
if(st!=='play')return;
spawnT-=dt;if(spawnT<=0){bananas.push({c:Math.floor(Math.random()*3),y:-16,done:false});spawnT=75/speed()}
for(const b of bananas){b.y+=speed()*dt;
 if(!b.done&&b.c===col&&b.y+16>=HEAD+2&&b.y<=HEAD+10){ // hit head = caught
  b.gone=true;caught++;bob=.12;$('score').textContent=caught;burst(COLS[b.c],HEAD);
  if(caught%10===0){sfx.up();toastT=1.2}else sfx.catch()}
 else if(b.y+16>=GY){b.gone=true;lives--;sfx.miss();if(lives<=0){over();break}}}
bananas=bananas.filter(b=>!b.gone)}
function draw(){
ctx.drawImage(bg,0,0);
for(const b of bananas)ctx.drawImage(banana,Math.round(COLS[b.c]-8),Math.round(b.y),16,16);
const mY=HEAD+(bob>0?2:0)+(st==='title'?Math.round(Math.sin(t*4)):0);
ctx.drawImage(tail,Math.round(mx+13+Math.sin(t*5)),mY+16,10,10);
ctx.drawImage(monkey,Math.round(mx-16),mY,32,30);
ctx.fillStyle='#fff3a0';parts.forEach(p=>ctx.fillRect(Math.round(p.x),Math.round(p.y),2,2));
if(st!=='title')for(let i=0;i<3;i++){ctx.globalAlpha=i<lives?1:.3;ctx.drawImage(heart,4+i*10,4)}ctx.globalAlpha=1}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;t+=dt;update(dt);draw();requestAnimationFrame(loop)}
screen('home');requestAnimationFrame(loop);
</script></body></html>
