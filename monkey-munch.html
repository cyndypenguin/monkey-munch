let R={wx:0,mx:RBASE,fy:RGY,vy:0,duck:false,held:false,jumpQ:false,ducking:false,hits:0,hitT:0,got:0,obs:[],bans:[],t:0,gx:240,sd:1,chase:false,cx:-34,clean:0};
const shd=(h,f)=>{const n=parseInt(h.slice(1),16);return '#'+[16,8,0].map(q=>Math.round(((n>>q)&255)*f).toString(16).padStart(2,'0')).join('')};
// ---- hazard styles: every free world re-skins the same four roles (ground=jump, duck, falling/flying=dodge, chaser). Other worlds use the Sunny set. ----

const WH={

2:{g:['stump','#2a2236','#4a3a5a','STUMPS'],d:['branch','#1a1426','#3a2a4a','BRANCHES'],f:['#4a3a2a','#6a5a3a','ACORNS'],w:['#1a1426','#ff4060','BATS'],c:['shadow','#14102a','#ff3040','SHADOW']},
3:{g:['castle','#e8c070','#d4a85a','SANDCASTLES'],d:['frond','#2f8a4a','#4caf50','PALM FRONDS'],f:['#6a4a2a','#8a6a3a','COCONUTS'],w:['#ffffff','#9ab0c8','SEAGULLS'],c:['wall','#3a9ad8','#ffffff','BIG WAVE']},
4:{g:['ball','#e8f2ff','#bcd2ea','SNOWBALLS'],d:['icicle','#bfe6ff','#8fc8f0','ICICLES'],f:['#ffffff','#d0e0f0','SNOW CLUMPS'],w:['#f0f6ff','#8aa0c0','SNOW OWLS'],c:['wall','#f4f8ff','#c4d4ea','AVALANCHE']},
9:{g:['root','#4a3218','#6a4a28','ROOTS'],d:['snake','#e8c030','#a02020','SNAKES'],f:['#c04a30','#e08a50','FRUIT'],w:['#e8412c','#3a7ae8','PARROTS'],c:['shadow','#e0902a','#2a1a10','JAGUAR']},
10:{g:['idol','#7a8a7a','#a0b0a0','STONE IDOLS'],d:['vine','#ff5fa2','#ffd23f','FLOWER VINES'],f:['#6a4a2a','#8a6a3a','SEEDS'],w:['#ff9fd0','#9fd0ff','BUTTERFLIES'],c:['wall','#8a6a4a','#c4a070','STAMPEDE']},
11:{g:['stump','#6b4a2a','#8a6a3a','BRANCH STUBS'],d:['curtain','#3aac58','#2e7d32','LEAF CURTAINS'],f:['#8a5a2a','#a87a3a','NUTS'],w:['#1a1a1a','#ff9f2e','TOUCANS'],c:['shadow','#2a2230','#ff3040','GIANT SPIDER']},
12:{g:['log','#5a3a1c','#7a5a3a','FALLEN TRUNKS'],d:['moss','#6a8a2a','#8aa84a','HANGING MOSS'],f:['#a8a030','#c8c050','FRUIT'],w:['#3a2a1a','#6a4a2a','FRUIT BATS'],c:['wall','#e8dcc0','#fff3d8','MIST WALL']}};
const hz=()=>WH[theme]||WH[0];
const HZ={
 ground(tpl,a,b,x,w,h){const y=RGY-h,c=ctx;
  if(tpl==='ball'){for(let k=0;k<w;k+=h){disc(x+k+h/2,RGY-h/2,h/2,a);disc(x+k+h/2-2,RGY-h/2-2,2,b)}}
  else if(tpl==='castle'){c.fillStyle=a;c.fillRect(x,y+6,w,h-6);c.fillRect(x,y,4,8);c.fillRect(x+w-4,y,4,8);c.fillStyle=b;c.fillRect(x+w/2-2,y+3,4,h-3);c.fillRect(x,y+6,w,2)}
  else if(tpl==='stump'){c.fillStyle=a;c.fillRect(x,y,w,h);c.fillStyle=b;c.fillRect(x,y,w,4);c.fillRect(x+3,y+1,Math.max(2,w-6),2)}
  else if(tpl==='idol'){c.fillStyle=a;c.fillRect(x,y,w,h);c.fillStyle=b;c.fillRect(x,y,w,3);c.fillStyle=shd(a,.5);c.fillRect(x+2,y+6,3,3);c.fillRect(x+w-5,y+6,3,3);c.fillRect(x+3,y+13,Math.max(2,w-6),2)}
  else if(tpl==='root'){c.fillStyle=a;c.fillRect(x,y+4,4,h-4);c.fillRect(x+w-4,y+4,4,h-4);c.fillRect(x,y,w,6);c.fillStyle=b;c.fillRect(x,y,w,2)}
  else if(tpl==='rock'){c.fillStyle=a;c.fillRect(x,y,w,h);c.fillStyle=b;c.fillRect(x,y,w,3);c.fillRect(x,y,3,h)}
  else{c.fillStyle=a;c.fillRect(x,y,w,h);c.fillStyle=b;c.fillRect(x,y,w,3);c.fillStyle='#c9a070';c.fillRect(x,y+3,3,h-3)}},
 duck(tpl,a,b,x,w,h){const c=ctx;
  if(tpl==='icicle'){for(let i=0;i<3;i++){const ww=Math.floor(w/3),hh=h-(i%2?8:0);c.fillStyle=i%2?b:a;c.fillRect(x+i*ww,0,ww,hh);c.fillRect(x+i*ww+1,hh,ww-2,4)}}
  else if(tpl==='branch'){c.fillStyle=a;c.fillRect(x-4,0,w+8,8);c.fillRect(x+2,8,3,h-8);c.fillRect(x+w-5,8,3,h-14);c.fillStyle=b;c.fillRect(x,h-4,6,6)}
  else if(tpl==='frond'){c.fillStyle=a;c.fillRect(x+w/2-1,0,2,h-6);c.fillStyle=b;c.fillRect(x-4,h-10,w+8,4);c.fillRect(x-2,h-6,w+4,4);c.fillRect(x,h-2,w,3)}
  else if(tpl==='moss'){c.fillStyle=a;c.fillRect(x,0,w,6);[[2,h],[6,h-8],[10,h-3]].forEach(([dx,hh])=>{c.fillStyle=b;c.fillRect(x+dx,6,3,hh-6)})}
  else if(tpl==='curtain'){c.fillStyle=a;c.fillRect(x,0,w,h);c.fillStyle=b;for(let i=0;i<w;i+=4)c.fillRect(x+i,h,3,3+(i%8?2:0))}
  else if(tpl==='snake'){c.fillStyle='#4a7a2a';c.fillRect(x+6,0,2,h-6);c.fillStyle=a;c.fillRect(x+3,h-8,9,6);c.fillStyle=b;c.fillRect(x+4,h-6,3,2)}
  else{c.fillStyle='#4a7a2a';c.fillRect(x+6,0,2,h);c.fillStyle=a;c.fillRect(x,h-6,w,8);c.fillStyle=b;c.fillRect(x+2,h-6,4,3)}},
 drop(a,b,x,y){disc(x,y,5,a);disc(x-2,y-2,1,b)},
 wing(a,b,x,y,tt){const f=Math.floor(tt*8)%2;ctx.fillStyle=a;ctx.fillRect(x-4,y,8,3);ctx.fillRect(x-7,y-f*3,4,2);ctx.fillRect(x+3,y-f*3,4,2);ctx.fillStyle=b;ctx.fillRect(x+3,y,3,2)},
 chase(tpl,a,b,cx,tt){const c=ctx;
  if(tpl==='wall'){c.fillStyle=a;c.fillRect(cx-20,RGY-70,34,70+60);for(let y=0;y<70;y+=6){c.fillStyle=b;c.fillRect(cx+10+Math.sin(tt*5+y)*2,RGY-70+y,6,4)}}
  else if(tpl==='shadow'){c.fillStyle=a;c.fillRect(cx-24,RGY-50,38,50);c.fillRect(cx-18,RGY-58,26,10);c.fillStyle=b;c.fillRect(cx+2,RGY-42,5,5);c.fillRect(cx+2,RGY-30,5,5)}
  else{disc(cx-4,RGY-24,24,a);disc(cx-10,RGY-32,5,b);c.fillStyle=b;const k=Math.floor(tt*6)%4;c.fillRect(cx-4+k*3,RGY-30,2,14)}}};
function addPattern(){const S=hz(),rn=()=>(R.sd=R.sd*16807%2147483647)/2147483647,gd=GD[S.g[0]],x=R.gx,k=Math.floor(rn()*5);
 const gt=gd[1]>=20?42:30;   // taller obstacles get banana arcs higher up
 if(k===0){R.obs.push({t:'g',x,w:gd[0],h:gd[1]});[0,1,2].forEach(i=>R.bans.push({x:x-6+i*10,y:RGY-gd[1]-14-(i===1?8:0)}))}
 else if(k===1){R.obs.push({t:'d',x,w:14,h:RGY-22});[0,1,2].forEach(i=>R.bans.push({x:x-6+i*10,y:RGY-10}))}
 else if(k===2){R.obs.push({t:'g',x,w:gd[0]+6,h:gd[1]});[0,1,2,3].forEach(i=>R.bans.push({x:x-2+i*10,y:RGY-gd[1]-18-(i%3===1?6:0)}))}
 else if(k===3){R.obs.push({t:'g',x,w:gd[0],h:gd[1]});[0,1,2].forEach(i=>R.bans.push({x:x-6+i*9,y:RGY-gt-gd[1]*.2-(i===1?6:0)}))}
 else{[0,1,2,3,4].forEach(i=>R.bans.push({x:x+i*10,y:RGY-16-Math.round(Math.sin(i/4*Math.PI)*22)}))}
 R.gx+=Math.max(92,100+rn()*50-Math.min(18,R.wx/150))}
function ensureGen(){while(R.gx<R.wx+420)addPattern()}
function startRun(chase){fixEq();unl=[];justGot=[];starsGain=0;aud();sfx.start();R={wx:0,mx:RBASE,fy:RGY,vy:0,duck:false,held:false,jumpQ:false,ducking:false,hits:0,hitT:0,got:0,obs:[],bans:[],t:0,gx:240,sd:(Date.now()%2147483646)+1,chase:!!chase,cx:-34,clean:0};ensureGen();st='play';$('score').textContent=0;screen('')}
function endRun(){st='over';finishLevel(R.got)}
function runUpdate(dt){lockT=Math.max(0,lockT-dt);toastT=Math.max(0,toastT-dt);$('toast').style.opacity=toastT>0?1:0;if(st!=='play')return;
 R.t+=dt;R.wx+=(62+Math.min(40,R.wx/70))*dt;ensureGen();R.obs=R.obs.filter(o=>o.x-R.wx>-60);
 const onG=R.fy>=RGY-.01;if(R.jumpQ&&onG)R.vy=-320;R.jumpQ=false;if(!R.held&&R.vy<-160)R.vy=-160;
 R.vy+=700*dt;R.fy+=R.vy*dt;if(R.fy>=RGY){R.fy=RGY;R.vy=0}
 R.ducking=R.duck&&R.fy>=RGY-.01;R.hitT=Math.max(0,R.hitT-dt);if(R.hitT<=0&&R.mx<RBASE)R.mx=Math.min(RBASE,R.mx+16*dt);
 const bl=R.mx+16,br=R.mx+30,bt=R.fy-(R.ducking?16:30),bb=R.fy;
 if(R.hitT<=0)for(const o of R.obs){const sx=o.x-R.wx,top=o.t==='d'?0:RGY-o.h,bot=o.t==='d'?o.h:RGY;if(sx<br&&sx+o.w>bl&&top<bb&&bot>bt){R.hits++;R.hitT=1;R.mx-=R.chase?12:20;if(R.chase)R.cx+=16;sfx.miss();break}}
 R.bans=R.bans.filter(b=>{const sx=b.x-R.wx;if(sx>bl-4&&sx<br+2&&b.y>bt-4&&b.y<bb+2){R.got++;total++;bankBanana();$('score').textContent=R.got;sfx.catch();if(R.chase)R.cx=Math.max(-34,R.cx-2);return false}return sx>-16});
 if(R.chase){R.cx+=3*dt;if(R.hitT>0)R.clean=0;else R.clean+=dt;if(R.clean>3)R.cx=Math.max(-34,R.cx-6*dt);if(R.cx+24>=R.mx+14)endRun()}
 else if(R.mx<-24)endRun()}
function runDraw(){const B=bg,T=B.T,wx=R.wx,S=hz();
 ctx.drawImage(B.sky,0,0);if(!T.custom)ctx.drawImage(B.sunSpr,92,32,32,32);
 ctx.fillStyle=shd(T.bands[6],.8);for(let i=0;i<144;i+=4){const x=i+wx*.15,h=Math.round((Math.sin(x*.045)*14+Math.sin(x*.13)*5+30)/4)*4;ctx.fillRect(i,RGY-h,4,h)}
 ctx.fillStyle=shd(T.bands[7],.55);for(let i=0;i<144;i+=4){const x=i+wx*.4,h=Math.round((Math.sin(x*.07+2)*8+18)/4)*4;ctx.fillRect(i,RGY-h,4,h)}
 const tc=T.dc||shd(T.bands[7],.4);ctx.fillStyle=tc;for(let k=-1;k<6;k++){const x=k*38-(wx*.7%38)+((k*17)%11);ctx.fillRect(x+6,RGY-34,4,34);ctx.fillRect(x,RGY-44,16,12);ctx.fillRect(x+3,RGY-50,10,8)}
 ctx.fillStyle=T.gr[0];ctx.fillRect(0,RGY,144,4);ctx.fillStyle=T.gr[1];ctx.fillRect(0,RGY+4,144,256-RGY-4);ctx.fillStyle=T.gr[2];const off=Math.floor(wx)%8;for(let y=RGY+4;y<256;y+=4)for(let k=-8+((y/4)%2)*4-off;k<144;k+=8)ctx.fillRect(k,y,4,4);
 if(T.tuft){ctx.fillStyle=T.tuft;for(let k=-1;k<9;k++){const x=k*18-(wx%18);ctx.fillRect(x,RGY-3,2,3);ctx.fillRect(x+2,RGY-2,2,2)}}
 R.obs.forEach(o=>{const sx=o.x-wx;if(sx>150||sx<-30)return;if(o.t==='d')HZ.duck(S.d[0],S.d[1],S.d[2],sx,o.w,o.h);else HZ.ground(S.g[0],S.g[1],S.g[2],sx,o.w,o.h)});
 R.bans.forEach((b,i)=>{const sx=b.x-wx;if(sx>150||sx<-16)return;ctx.drawImage(banana,Math.round(sx-6),Math.round(b.y-6+Math.sin(R.t*5+i)*1.5),12,12)});
 if(R.chase)HZ.chase(S.c[0],S.c[1],S.c[2],R.cx,R.t);
 const f=R.hitT>.5?'hurt':R.fy<RGY-.5?'jump':R.ducking?'duck':(Math.floor(R.t*8)%2?'run2':'run1'),spr=sideFrames[f],sy=Math.round(R.fy)-38;
 ctx.save();ctx.translate(Math.round(R.mx)+22,RGY+2);ctx.scale(1,.2);const q=ctx.createRadialGradient(0,0,0,0,0,18);q.addColorStop(0,'rgba(60,25,5,.45)');q.addColorStop(1,'rgba(60,25,5,0)');ctx.fillStyle=q;ctx.fillRect(-18,-18,36,36);ctx.restore();
 if(!(R.hitT>0&&Math.floor(R.t*14)%2)){ctx.drawImage(spr,Math.round(R.mx),sy,44,38);const HT=HATS[hat];if(HT.s)ctx.drawImage(HT.s,Math.round(R.mx+30-HT.s.width),sy+SIDE_HEAD[f]*2+HT.dy+2,HT.s.width*2,HT.s.height*2)}
 if(R.chase?(R.cx+24>R.mx-8):R.mx<10){ctx.fillStyle='rgba(255,60,60,'+(.3+.25*Math.sin(R.t*14))+')';ctx.fillRect(0,0,4,256)}}
// ---- Dodge: fly anywhere (drag a finger, or arrow keys); collect bananas, avoid falling and flying hazards ----
let D={mx:72,my:150,tx:72,ty:150,hits:0,hitT:0,got:0,t:0,bans:[],haz:[],sb:.5,sh:1.2},dkeys={l:0,r:0,u:0,d:0};
function startDodge(){fixEq();unl=[];justGot=[];starsGain=0;aud();sfx.start();D={mx:72,my:150,tx:72,ty:150,hits:0,hitT:0,got:0,t:0,bans:[],haz:[],sb:.5,sh:1.2};st='play';$('score').textContent=0;screen('')}
function dodgeAim(e){const r=game.getBoundingClientRect();D.tx=(e.clientX-r.left)/r.width*144;D.ty=(e.clientY-r.top)/r.height*256-22}
function dodgeUpdate(dt){lockT=Math.max(0,lockT-dt);toastT=Math.max(0,toastT-dt);$('toast').style.opacity=toastT>0?1:0;hurtT=0;if(st!=='play')return;
 D.t+=dt;if(dkeys.l||dkeys.r||dkeys.u||dkeys.d){D.tx=D.mx+(dkeys.r-dkeys.l)*40;D.ty=D.my+(dkeys.d-dkeys.u)*40}
 const dx=D.tx-D.mx,dy=D.ty-D.my,dist=Math.hypot(dx,dy);if(dist>1){const sp=Math.min(dist,130*dt);D.mx+=dx/dist*sp;D.my+=dy/dist*sp}
 D.mx=Math.max(14,Math.min(130,D.mx));D.my=Math.max(48,Math.min(222,D.my));D.hitT=Math.max(0,D.hitT-dt);
 D.sb-=dt;if(D.sb<=0){D.bans.push({x:16+Math.random()*112,y:50+Math.random()*165,l:7});D.sb=.95}
 D.sh-=dt;if(D.sh<=0){const v=Math.min(70,D.t*1.4);if(Math.random()<.5)D.haz.push({k:'d',x:10+Math.random()*124,y:-8,vx:0,vy:60+v});else{const L=Math.random()<.5;D.haz.push({k:'w',x:L?-10:154,y:50+Math.random()*170,vx:(L?1:-1)*(46+v*.9),vy:0})}D.sh=Math.max(.42,1.5-D.t*.012)}
 D.haz.forEach(h=>{h.x+=h.vx*dt;h.y+=h.vy*dt});D.haz=D.haz.filter(h=>h.y<270&&h.x>-20&&h.x<164);
 D.bans=D.bans.filter(b=>{b.l-=dt;if(Math.hypot(b.x-D.mx,b.y-(D.my+2))<16){D.got++;total++;bankBanana();$('score').textContent=D.got;sfx.catch();return false}return b.l>0});
 if(D.hitT<=0)for(const h of D.haz){if(Math.hypot(h.x-D.mx,h.y-(D.my+2))<(h.k==='d'?15:16)){D.hits++;D.hitT=1.3;D.haz=D.haz.filter(q=>q!==h);sfx.miss();if(D.hits>=3){st='over';finishLevel(D.got)}break}}}
function dodgeDraw(){const S=hz();drawBg(bg,t);
 D.bans.forEach((b,i)=>{if(b.l<1.5&&Math.floor(t*10)%2)return;ctx.drawImage(banana,Math.round(b.x-6),Math.round(b.y-6+Math.sin(t*5+i)*1.5),12,12)});
 D.haz.forEach(h=>{if(h.k==='d')HZ.drop(S.f[0],S.f[1],Math.round(h.x),Math.round(h.y));else HZ.wing(S.w[0],S.w[1],Math.round(h.x),Math.round(h.y),t)});
 const my=Math.round(D.my)-17;
 if(!(D.hitT>0&&Math.floor(t*14)%2)){ctx.drawImage(D.hitT>.8?monkeyHurt:monkey,Math.round(D.mx-16),my,32,34);const HT=HATS[hat];if(HT.s)ctx.drawImage(HT.s,Math.round(D.mx-HT.s.width),my+HT.dy,HT.s.width*2,HT.s.height*2)}
 for(let i=0;i<3;i++){ctx.globalAlpha=i<3-D.hits?1:.3;ctx.drawImage(heart,4+i*10,4)}ctx.globalAlpha=1}
// ---- level flow ----
function finishLevel(score){const L=LEVELS[curLevel],b=levelBest[L.id]||(levelBest[L.id]={s:0,b:0}),pb=b.b,ps=b.s,before=lOK(),stars=L.t.filter(x=>score>=x).length;
 b.b=Math.max(b.b,score);b.s=Math.max(b.s,stars);const after=lOK();Object.keys(after).forEach(key=>{if(!before[key]){const it=itemOf(key);unl.push({k:it.k,i:it.i,n:it.q.n})}});
 lvResult={score,stars,newBest:score>pb,unlocked:(curLevel<LEVELS.length-1&&ps<2&&b.s>=2)?LEVELS[curLevel+1].n:''};
 if(unl.length)nw=true;st='over';lockT=.6;save();screen('lvdone');stars?sfx.up():sfx.miss()}
function startLevel(i){curLevel=i;lvSel=i;const k=LEVELS[i].k;if(k==='catch'){storm=false;start()}else if(k==='storm'){storm=true;start()}else if(k==='dodge')startDodge();else startRun(k==='chase')}
const watchOut=L=>{const S=hz();return L.k==='catch'?'BANANAS HITTING THE GROUND':L.k==='run'?S.g[3]+' AND '+S.d[3]:L.k==='dodge'?S.f[2]+' AND '+S.w[2]:L.k==='storm'?'ROTTEN BANANAS':S.c[3]+', '+S.g[3]+' AND '+S.d[3]};
const how=L=>L.k==='catch'?'MOVE BETWEEN 3 LANES. 3 MISSES ENDS IT':L.k==='run'?'RIGHT SIDE JUMPS, LEFT SIDE DUCKS':L.k==='dodge'?'DRAG TO FLY. 3 HITS ENDS IT':L.k==='storm'?'GOLD = 5. SHIELD SAVES A HEART':'JUMP AND DUCK. BANANAS PUSH IT BACK';
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;t+=dt;const lkd=LEVELS[curLevel].k;if(st==='title'||lkd==='catch'||lkd==='storm'){update(dt);draw()}else if(lkd==='dodge'){dodgeUpdate(dt);dodgeDraw()}else{runUpdate(dt);runDraw()}requestAnimationFrame(loop)}
screen('home');requestAnimationFrame(loop);
